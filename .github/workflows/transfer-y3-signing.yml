name: Transfer the encrypted Y3 signing authorization

on:
  workflow_dispatch:
    inputs:
      expected_bootstrap_sha:
        description: Exact reviewed main commit shared with the parent
        required: true
        type: string
      parent_run_id:
        description: Exact parent preparation run
        required: true
        type: string
      parent_attempt:
        description: Exact parent preparation attempt
        required: true
        type: string
      encrypted_payload:
        description: Bounded Base64 age ciphertext only
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  transfer-ciphertext:
    if: >-
      github.repository == '444yttt/astro-blog-starter-template' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.expected_bootstrap_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      Y3_EXPECTED_BOOTSTRAP_SHA: ${{ inputs.expected_bootstrap_sha }}
      Y3_PRIVATE_SOURCE_SHA: '67837110f114bf10c9e38ff6914d8c1db2755da1'
    steps:
      - name: Checkout the exact reviewed app preparation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publish only the encrypted handoff for the exact parent
        shell: bash
        env:
          Y3_CHECK_TOKEN: ${{ github.token }}
          Y3_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          Y3_PARENT_ATTEMPT: ${{ inputs.parent_attempt }}
          Y3_ENCRYPTED_PAYLOAD: ${{ inputs.encrypted_payload }}
        run: |
          set +x
          set -euo pipefail
          python3 ci/y3-bootstrap/bootstrap.py publish-handoff
